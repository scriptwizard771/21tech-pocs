name: Deploy to AWS EC2
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    
env:
  PYTHON_VERSION: '3.11'
jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Debug Connection Parameters
      run: |
        echo "🔍 Debugging connection parameters..."
        echo "Hostname length: ${#AWS_HOST}"
        echo "Username length: ${#AWS_USERNAME}"
        echo "Port: $AWS_PORT"
        
        # Check if variables are set
        if [ -z "$AWS_HOST" ]; then
          echo "❌ AWS_HOST is not set or empty"
          exit 1
        fi
        
        if [ -z "$AWS_USERNAME" ]; then
          echo "❌ AWS_USERNAME is not set or empty"
          exit 1
        fi
        
        echo "✅ Basic parameter validation passed"
      env:
        AWS_HOST: ${{ secrets.AWS_HOST }}
        AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
        AWS_PORT: ${{ secrets.AWS_PORT }}
    - name: Test Network Connectivity
      run: |
        echo "🌐 Testing network connectivity..."
        
        # Test DNS resolution
        echo "Testing DNS resolution for ${{ secrets.AWS_HOST }}..."
        nslookup ${{ secrets.AWS_HOST }} || {
          echo "⚠️ DNS resolution failed, trying direct IP connection..."
        }
        
        # Test ping
        echo "Testing ping to ${{ secrets.AWS_HOST }}..."
        ping -c 3 ${{ secrets.AWS_HOST }} || echo "⚠️ Ping failed"
        
        # Test basic connectivity to SSH port
        echo "Testing SSH port connectivity..."
        timeout 10 bash -c "echo >/dev/tcp/${{ secrets.AWS_HOST }}/${{ secrets.AWS_PORT }}" && {
          echo "✅ Port ${{ secrets.AWS_PORT }} is reachable"
        } || {
          echo "❌ Port ${{ secrets.AWS_PORT }} is not reachable"
          echo "💡 Possible issues:"
          echo "1. EC2 instance is stopped"
          echo "2. Security group doesn't allow SSH from GitHub Actions"
          echo "3. Wrong IP address in AWS_HOST secret"
          echo "4. Network ACLs blocking traffic"
          exit 1
        }
    - name: Setup SSH
      run: |
        echo "🔑 Setting up SSH configuration..."
        mkdir -p ~/.ssh
        
        # Write SSH key
        echo "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Validate SSH key format
        echo "Validating SSH private key format..."
        if ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
          echo "✅ SSH private key format is valid"
        else
          echo "❌ SSH private key format is invalid"
          echo "🔍 Key file details:"
          echo "Key file size: $(wc -c < ~/.ssh/id_rsa) bytes"
          echo "First line: $(head -n 1 ~/.ssh/id_rsa)"
          echo "Last line: $(tail -n 1 ~/.ssh/id_rsa)"
          echo ""
          echo "💡 Please verify:"
          echo "1. AWS_PRIVATE_KEY contains the complete .pem file content"
          echo "2. Key starts with '-----BEGIN RSA PRIVATE KEY-----' or similar"
          echo "3. Key ends with '-----END RSA PRIVATE KEY-----' or similar"
          echo "4. No extra spaces or characters"
          exit 1
        fi
        
        # Add to known hosts with better error handling
        echo "Adding ${{ secrets.AWS_HOST }} to known_hosts..."
        ssh-keyscan -H -p ${{ secrets.AWS_PORT }} ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || {
          echo "⚠️ ssh-keyscan failed, using StrictHostKeyChecking=no"
        }
    - name: Test SSH Connection with Detailed Logging
      run: |
        echo "🔌 Testing SSH connection with detailed logging..."
        
        # Test SSH connection with verbose output and multiple attempts
        for attempt in 1 2 3; do
          echo "SSH attempt $attempt/3..."
          
          if ssh -v \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o LogLevel=DEBUG \
              -p ${{ secrets.AWS_PORT }} \
              -i ~/.ssh/id_rsa \
              ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} \
              "echo 'SSH connection successful - $(date)' && whoami && pwd && uptime"; then
            echo "✅ SSH connection successful on attempt $attempt"
            break
          else
            echo "❌ SSH attempt $attempt failed"
            if [ $attempt -eq 3 ]; then
              echo ""
              echo "💡 Troubleshooting checklist:"
              echo "1. ✅ Check if EC2 instance is running in AWS Console"
              echo "2. ✅ Verify Security Group allows SSH (port ${{ secrets.AWS_PORT }}) from 0.0.0.0/0"
              echo "3. ✅ Confirm the public IP address is correct: ${{ secrets.AWS_HOST }}"
              echo "4. ✅ Test SSH locally: ssh -i AIUseCasesKeyPair.pem ec2-user@${{ secrets.AWS_HOST }}"
              echo "5. ✅ Check if key pair matches the EC2 instance"
              echo ""
              echo "🔍 Debug information:"
              echo "Host: ${{ secrets.AWS_HOST }}"
              echo "Port: ${{ secrets.AWS_PORT }}"
              echo "User: ${{ secrets.AWS_USERNAME }}"
              exit 1
            fi
            sleep 10
          fi
        done
    - name: Deploy Application
      run: |
        echo "🚀 Starting deployment process..."
        
        # Deploy with better error handling
        ssh -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.AWS_PORT }} \
            -i ~/.ssh/id_rsa \
            ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} << 'EOF'
          set -e
          
          echo "🚀 Starting deployment process on server..."
          echo "Current user: $(whoami)"
          echo "Current directory: $(pwd)"
          echo "Server time: $(date)"
          echo "Server uptime: $(uptime)"
          
          # Navigate to application directory
          cd /home/ec2-user
          if [ ! -d "21tech-pocs" ]; then
            echo "📥 Cloning repository for the first time..."
            git clone https://github.com/${{ github.repository }}.git 21tech-pocs
          fi
          
          cd 21tech-pocs
          echo "📂 Current directory: $(pwd)"
          
          # Update code
          echo "🔄 Updating code from origin/${{ github.ref_name }}..."
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          echo "📊 Latest commit: $(git log --oneline -n 1)"
          
          # Setup environment
          echo "🔑 Setting up environment file..."
          cat > .env << 'ENVEOF'
        SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
        DEBUG=False
        ALLOWED_HOSTS=${{ secrets.AWS_HOST }},localhost,127.0.0.1
        HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}
        ES_URL=http://elasticsearch:9200
        ENVEOF
          echo "✅ Environment file created"
          
          # Docker setup
          echo "🐳 Setting up Docker..."
          if ! command -v docker &> /dev/null; then
            echo "Installing Docker..."
            sudo yum update -y
            sudo yum install -y docker
            sudo service docker start
            sudo usermod -a -G docker ec2-user
            
            # Install Docker Compose
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            sudo systemctl enable docker
            
            echo "⏳ Waiting for Docker to initialize..."
            sleep 15
            
            # Note: Need to reconnect for group changes to take effect
            echo "⚠️ Docker installed. You may need to reconnect for group changes."
          fi
          
          # Ensure Docker is running
          sudo systemctl start docker
          echo "🐳 Docker status: $(sudo systemctl is-active docker)"
          
          # Stop existing services
          echo "🛑 Stopping existing services..."
          sudo docker-compose -f resources/docker-compose.prod.yml down || true
          
          # Clean up
          echo "🧹 Cleaning up old containers and images..."
          sudo docker system prune -f || true
          
          # Build and start services
          echo "🔨 Building and starting services..."
          sudo docker-compose -f resources/docker-compose.prod.yml up --build -d
          
          # Wait and check
          echo "⏳ Waiting for services to start (60 seconds)..."
          sleep 60
          
          echo "🔍 Checking service status..."
          sudo docker-compose -f resources/docker-compose.prod.yml ps
          
          echo "📋 Container logs (last 15 lines)..."
          sudo docker-compose -f resources/docker-compose.prod.yml logs --tail=15
          
          # Test application
          echo "🧪 Testing internal application connectivity..."
          for i in {1..5}; do
            if curl -f http://localhost:8001/robots.txt 2>/dev/null; then
              echo "✅ Internal application test passed on attempt $i"
              break
            elif [ $i -eq 5 ]; then
              echo "❌ Internal application test failed after 5 attempts"
              echo "🔍 Checking Django app logs..."
              sudo docker-compose -f resources/docker-compose.prod.yml logs django_app --tail=20
            else
              echo "⚠️ Internal test attempt $i failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
          
          echo "✅ Deployment process completed!"
        EOF
    - name: Verify External Access
      run: |
        echo "🔍 Verifying external access to deployed application..."
        
        # Wait for application to be fully ready
        sleep 30
        
        # Test external endpoints with retries
        echo "Testing robots.txt endpoint..."
        for i in {1..5}; do
          HTTP_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://${{ secrets.AWS_HOST }}:8001/robots.txt)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ External robots.txt accessible (HTTP $HTTP_CODE) on attempt $i"
            break
          else
            echo "⚠️ External test attempt $i failed (HTTP $HTTP_CODE), retrying in 15 seconds..."
            sleep 15
          fi
        done
        
        echo "Testing admin endpoint..."
        HTTP_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://${{ secrets.AWS_HOST }}:8001/admin/)
        if [[ "$HTTP_CODE" =~ ^(200|301|302)$ ]]; then
          echo "✅ Admin endpoint responding (HTTP $HTTP_CODE)"
        else
          echo "⚠️ Admin endpoint not responding properly (HTTP $HTTP_CODE)"
        fi
    - name: Final Health Check
      run: |
        echo "🏥 Performing final health check..."
        
        ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no -p ${{ secrets.AWS_PORT }} -i ~/.ssh/id_rsa ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} << 'EOF'
          echo "📊 Final server health status:"
          
          echo "Docker containers:"
          sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          echo -e "\nResource usage:"
          sudo docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}" 2>/dev/null || echo "Docker stats unavailable"
          
          echo -e "\nDisk usage:"
          df -h /
          
          echo -e "\nMemory usage:"
          free -h
          
          echo -e "\nNetwork connectivity test:"
          curl -s -o /dev/null -w "Internal HTTP Status: %{http_code}\n" http://localhost:8001/robots.txt || echo "Internal HTTP test failed"
          
          echo -e "\nService logs check:"
          sudo docker-compose -f /home/ec2-user/21tech-pocs/resources/docker-compose.prod.yml logs --tail=5 django_app 2>/dev/null || echo "Could not retrieve django_app logs"
        EOF
    - name: Deployment Summary
      if: always()
      run: |
        echo ""
        echo "🎯 Deployment Summary"
        echo "===================="
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Server: ${{ secrets.AWS_HOST }}:8001"
        echo "Status: ${{ job.status }}"
        echo "Time: $(date)"
        echo ""
        echo "🌐 Application URLs:"
        echo "Main: https://${{ secrets.AWS_HOST }}:8001/"
        echo "Admin: https://${{ secrets.AWS_HOST }}:8001/admin/"
        echo "API: https://${{ secrets.AWS_HOST }}:8001/api/"
        echo ""
        echo "🛠️ Server Management Commands:"
        echo "SSH: ssh -i AIUseCasesKeyPair.pem ec2-user@${{ secrets.AWS_HOST }}"
        echo "Logs: sudo docker-compose -f resources/docker-compose.prod.yml logs"
        echo "Status: sudo docker-compose -f resources/docker-compose.prod.yml ps"
  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    
    steps:
    - name: Setup SSH for Rollback
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
    - name: Perform Rollback
      run: |
        echo "🔄 Deployment failed, attempting rollback..."
        
        ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no -p ${{ secrets.AWS_PORT }} -i ~/.ssh/id_rsa ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} << 'EOF'
          cd /home/ec2-user/21tech-pocs || exit 1
          
          echo "🛑 Stopping failed deployment..."
          sudo docker-compose -f resources/docker-compose.prod.yml down || true
          
          echo "🔄 Rolling back to previous commit..."
          git log --oneline -n 5
          
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "Rolling back to previous commit..."
            git reset --hard HEAD~1
            
            echo "🚀 Starting rollback version..."
            sudo docker-compose -f resources/docker-compose.prod.yml up --build -d
            
            sleep 30
            echo "🔍 Checking rollback status..."
            sudo docker-compose -f resources/docker-compose.prod.yml ps
          else
            echo "⚠️ No previous commit found for rollback"
          fi
        EOF
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
    - name: Success Notification
      if: needs.deploy.result == 'success'
      run: |
        echo "🎉 Deployment Successful!"
        echo "✅ CI tests passed"
        echo "✅ Application deployed to: https://${{ secrets.AWS_HOST }}:8001"
        echo "✅ All services are running"
        
    - name: Failure Notification
      if: needs.deploy.result == 'failure'
      run: |
        echo "❌ Deployment Failed!"
        echo "🔄 Rollback may have been attempted"
        echo "📋 Check the deployment logs for details"
        echo ""
        echo "💡 Common solutions:"
        echo "1. Check EC2 instance is running"
        echo "2. Verify security group allows SSH"
        echo "3. Confirm IP address is current"
    - name: Skipped Notification
      if: needs.check-ci-status.outputs.should-deploy == 'false'
      run: |
        echo "⏭️ Deployment Skipped"
        echo "❌ CI tests failed - deployment was not attempted"
        echo "🛠️ Fix CI issues before deployment will proceed"