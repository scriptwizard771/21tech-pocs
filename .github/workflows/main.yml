name: CI/CD Build and Deploy to AWS EC2

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:

    name: Build and Push Django Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Clean Docker system
      run: |
        echo "Cleaning Docker system to avoid cache issues..."
        docker system prune -f || true
        docker builder prune -f || true

    - name: Build Django Docker image
      run: |
        echo "Building Django Docker image with dockerfile..."
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/django_app:latest -f resources/dockerfile.prod . --no-cache --pull

    - name: Push Docker image
      run: |
        echo "Pushing Django Docker image to Docker Hub..."
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/django_app:latest

  deploy:
    name: Deploy Docker Compose on EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: ${{ secrets.AWS_PORT }}
        script: |
          cd /home/${{ secrets.AWS_USERNAME }}
          
          # If repo exists, pull latest, else clone
          if [ -d "21tech-pocs" ]; then
            cd 21tech-pocs
            git reset --hard
            git pull origin ${{ github.ref_name }}
          else
            git clone https://github.com/scriptwizard771/21tech-pocs.git
            cd 21tech-pocs
          fi

          echo "Pulling latest Docker image from Docker Hub..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/django_app:latest

          echo "Stopping old containers..."
          docker-compose -f resources/docker-compose.prod.yml down || true

          echo "Starting new containers with pulled image..."
          docker-compose -f resources/docker-compose.prod.yml up -d

          echo "Current container status:"
          docker-compose -f resources/docker-compose.prod.yml ps

