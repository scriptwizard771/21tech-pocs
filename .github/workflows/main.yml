name: CI/CD Build and Deploy to AWS EC2
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to Docker Hub (optional, can be skipped if only using local save)
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build Docker image
      run: |
        docker build -t django_app:latest -f resources/dockerfile.prod .
    - name: Save Docker image as tar
      run: |
        docker save django_app:latest -o django_app.tar
    - name: Copy Docker image to EC2
      uses: appleboy/scp-action@v0.1.5
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: ${{ secrets.AWS_PORT }}
        source: "django_app.tar"
        target: "/home/${{ secrets.AWS_USERNAME }}/django_app.tar"
  deploy:
    name: Deploy Docker on EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Load and run Docker on EC2
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: ${{ secrets.AWS_PORT }}
        script: |
          cd /home/${{ secrets.AWS_USERNAME }}
          # Load the prebuilt Docker image
          docker load -i django_app.tar
          # Stop old containers
          docker-compose -f /home/${{ secrets.AWS_USERNAME }}/21tech-pocs/resources/docker-compose.prod.yml down || true
          # Start new containers
          docker-compose -f /home/${{ secrets.AWS_USERNAME }}/21tech-pocs/resources/docker-compose.prod.yml up -d
          # Clean up
          docker system prune -af
          # Show status
          docker-compose -f /home/${{ secrets.AWS_USERNAME }}/21tech-pocs/resources/docker-compose.prod.yml ps
