name: CI/CD Build and Deploy to AWS EC2

on:
  push:
    branches: [main, dev, ci_cd]
  workflow_dispatch:

jobs:
  build:
    name: Build and Push Django Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Django Docker image
      run: |
        echo "Building Django Docker image..."
        cd resources/
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/django_app:latest -f dockerfile.prod ..

    - name: Push Docker image to Docker Hub
      run: |
        echo "Pushing Docker image to Docker Hub..."
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/django_app:latest

  deploy:
    name: Deploy Docker Compose on EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repo for deployment assets
      uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: ${{ secrets.AWS_PORT }}
        script: |
          cd /home/${{ secrets.AWS_USERNAME }}

          # Pull or clone the repository
          if [ -d "21tech-pocs" ]; then
            echo "Repository exists. Updating..."
            cd 21tech-pocs
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
          else
            echo "Repository not found. Cloning fresh copy..."
            git clone -b ${{ github.ref_name }} https://github.com/scriptwizard771/21tech-pocs.git
            cd 21tech-pocs
          fi

          echo "Pulling latest Docker image from Docker Hub..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/django_app:latest

          echo "Starting updated containers using docker-compose.prod.yml..."
          docker-compose -f resources/docker-compose.prod.yml up -d --build

          echo "Deployment complete. Current container status:"
          docker-compose -f resources/docker-compose.prod.yml ps