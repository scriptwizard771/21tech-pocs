name: CI/CD Build and Deploy to AWS EC2
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
jobs:
  build:

    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        echo "Building Django Docker image..."
        docker build -t django_app:latest -f resources/dockerfile.prod .
        docker save -o django_app.tar django_app:latest
        chmod 644 django_app.tar
        ls -lh django_app.tar

    - name: Copy Docker image to EC2
      uses: appleboy/scp-action@v0.1.5
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: ${{ secrets.AWS_PORT }}
        source: "django_app.tar"
        target: "/home/${{ secrets.AWS_USERNAME }}/"
  deploy:
    name: Deploy Docker Compose on EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to EC2 (SSH + checks + logs)
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: ${{ secrets.AWS_PORT }}
        script: |
          set -euo pipefail

          DEPLOY_DIR="/home/${{ secrets.AWS_USERNAME }}/21tech-pocs"
          COMPOSE_FILE="$DEPLOY_DIR/resources/docker-compose.prod.yml"
          IMAGE_TAR="/home/${{ secrets.AWS_USERNAME }}/django_app.tar"

          echo "=== SSH: connected to remote host ==="
          echo "Host: $(hostname)  | User: $(whoami)"
          echo "Date: $(date)"
          echo "-------------------------------------"

          # Ensure docker is available
          if ! command -v docker >/dev/null 2>&1; then
            echo "ERROR: docker is not installed on remote host. Aborting."
            exit 1
          fi
          docker --version

          # Ensure docker-compose is available
          if ! command -v docker-compose >/dev/null 2>&1; then
            echo "ERROR: docker-compose is not installed on remote host. Aborting."
            exit 1
          fi
          docker-compose --version

          echo "Loading image (if present) from $IMAGE_TAR ..."
          if [ -f "$IMAGE_TAR" ]; then
            docker load -i "$IMAGE_TAR" || echo "Warning: docker load failed (continuing)"
          else
            echo "No image tar found at $IMAGE_TAR — assuming remote will pull/build images from repo."
          fi

          echo "Stopping any existing compose stack (ignore errors)..."
          docker-compose -f "$COMPOSE_FILE" down --remove-orphans || true

          echo "Starting compose stack..."
          docker-compose -f "$COMPOSE_FILE" up -d --build

          echo "Waiting for services to initialize..."
          sleep 8

          echo "=== Compose status ==="
          docker-compose -f "$COMPOSE_FILE" ps || true

          echo "=== Docker ps for django_app ==="
          docker ps --filter "name=django_app" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

          CONTAINER_ID=$(docker ps -q --filter "name=django_app" | head -n1 || true || true)
          if [ -z "$CONTAINER_ID" ]; then
            echo "ERROR: 'django_app' container is not running."
            echo "Showing last 200 lines of compose logs for debug:"
            docker-compose -f "$COMPOSE_FILE" logs --no-color --tail=200 || true
            exit 1
          fi

          echo "=== Last 200 lines of logs for django_app ($CONTAINER_ID) ==="
          docker logs --tail 200 "$CONTAINER_ID" || true

          echo "Deployment completed successfully."

