name: CI/CD Deploy to AWS EC2
on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Deploy and build on AWS EC2
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        script: |
          PROJECT_PATH="/home/${{ secrets.AWS_USERNAME }}/21tech-pocs"
          if [ ! -d "$PROJECT_PATH" ]; then
            git clone https://github.com/${{ github.repository }}.git $PROJECT_PATH
          fi
          cd $PROJECT_PATH
          git fetch origin 
          git reset --hard origin/${{ github.ref_name }}
          docker-compose -f resources/docker-compose.prod.yml down || true
          docker-compose -f resources/docker-compose.prod.yml up --build
          docker system prune -af
          docker-compose -f resources/docker-compose.prod.yml ps
