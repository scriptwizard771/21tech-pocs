name: CI/CD Build and Deploy to AWS EC2

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:

    name: Build and Push Django Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Django Docker image
      run: |
        echo "Building Django Docker image..."
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/django_app:latest -f resources/dockerfile.prod .

    - name: Push Docker image
      run: |
        echo "Pushing Django Docker image to Docker Hub..."
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/django_app:latest

  deploy:
    name: Deploy Docker Compose on EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: ${{ secrets.AWS_PORT }}
        script: |
          cd /home/${{ secrets.AWS_USERNAME }}/21tech-pocs/resources
          echo "Pulling latest Django image..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/django_app:latest

          echo "Stopping old containers..."
          docker-compose -f docker-compose.prod.yml down || true

          echo "Starting new containers..."
          docker-compose -f docker-compose.prod.yml up -d

          echo "Current container status:"
          docker-compose -f docker-compose.prod.yml ps
